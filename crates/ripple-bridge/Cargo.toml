[package]
name = "ripple-bridge"
description = "Development bridge: exposes the Ripple core to a normal browser over localhost."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
# Include the real WhatsApp backend (the default bridge build is demo-only and compiles fast).
live = ["ripple-core/live"]

[dependencies]
ripple-core = { path = "../ripple-core", default-features = false, features = ["voice"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
futures-util = "0.3"
