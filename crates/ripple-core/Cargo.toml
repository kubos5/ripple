[package]
name = "ripple-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["live", "voice"]
# The real WhatsApp backend. Off = demo-only build (much faster to compile).
live = ["dep:whatsapp-rust"]
# Voice-note recording (microphone capture + Opus encoding).
voice = ["dep:cpal", "dep:ropus", "dep:ogg"]

[dependencies]
whatsapp-rust = { version = "0.7", default-features = false, optional = true, features = [
    "sqlite-storage",
    "tokio-transport",
    "tokio-runtime",
    "tokio-native",
    "ureq-client",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
log = "0.4"
rand = "0.9"
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
cpal = { version = "0.18", optional = true }
ropus = { version = "0.12", optional = true }
ogg = { version = "0.9", optional = true }
